<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Rodrigo Aguillon - Chief Executive Officer and System Architect at SHELMIA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3a"/>
      <stop offset="0.5" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#08010f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f72585"/>
      <stop offset="0.5" stop-color="#ff5da2"/>
      <stop offset="1" stop-color="#8338ec"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f72585" stop-opacity="0"/>
      <stop offset="1" stop-color="#f72585" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- perspective grid (synthwave horizon) -->
  <g stroke="url(#fade)" stroke-width="1.1" opacity="0.6">
    <line x1="0" y1="176" x2="1000" y2="176"/>
    <line x1="0" y1="188" x2="1000" y2="188"/>
    <line x1="0" y1="202" x2="1000" y2="202"/>
    <line x1="500" y1="170" x2="60"  y2="220"/>
    <line x1="500" y1="170" x2="230" y2="220"/>
    <line x1="500" y1="170" x2="400" y2="220"/>
    <line x1="500" y1="170" x2="600" y2="220"/>
    <line x1="500" y1="170" x2="770" y2="220"/>
    <line x1="500" y1="170" x2="940" y2="220"/>
  </g>

  <!-- neon rule -->
  <rect x="330" y="44" width="340" height="3" rx="1.5" fill="#4cc9f0" filter="url(#glow)"/>

  <!-- name -->
  <text x="500" y="112" text-anchor="middle" font-family="Verdana, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="3" fill="url(#name)" filter="url(#glow)">RODRIGO AGUILLON</text>

  <!-- subtitle -->
  <text x="500" y="150" text-anchor="middle" font-family="Verdana, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#4cc9f0">CHIEF EXECUTIVE OFFICER &#183; SYSTEM ARCHITECT &#183; SHELMIA</text>
</svg>
