<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Synthwave wave">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8338ec"/>
      <stop offset="0.5" stop-color="#f72585"/>
      <stop offset="1" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#8338ec"/>
      <stop offset="1" stop-color="#f72585"/>
    </linearGradient>
  </defs>

  <!-- back wave -->
  <path d="M0,74 C180,34 320,114 520,74 C720,34 860,114 1000,74 L1000,130 L0,130 Z"
        fill="url(#w2)" opacity="0.45"/>
  <!-- front wave -->
  <path d="M0,54 C150,14 300,94 500,54 C700,14 850,94 1000,54 L1000,130 L0,130 Z"
        fill="url(#w1)"/>
</svg>
